name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行完整测试
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance benchmarks'
        required: false
        default: 'false'
        type: boolean
      run_security_scan:
        description: 'Run security scan'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.9'
  PYTORCH_VERSION: '2.0.0'
  CUDA_VERSION: '11.8'

jobs:
  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ env.PYTORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install -r requirements-dev.txt
    
    - name: Run pre-commit hooks
      run: |
        pre-commit install
        pre-commit run --all-files
      continue-on-error: true
    
    - name: Run comprehensive code quality checks
      run: |
        python scripts/code_quality.py --tools all --format json --output quality-report.json --show-details
      continue-on-error: true
    
    - name: Run code formatting checks
      run: |
        python scripts/format_code.py --check --target-dirs modify_multi_attention tests scripts
      continue-on-error: true
    
    - name: Run quality gate check
      run: |
        python scripts/quality_gate.py --target-dirs modify_multi_attention tests scripts --output quality-gate-report.md
      continue-on-error: true
    
    - name: Auto-fix code issues (if allowed)
      if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-fix')
      run: |
        python scripts/auto_fix.py --target-dirs modify_multi_attention tests scripts --output auto-fix-report.md
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || git commit -m "Auto-fix code quality issues [skip ci]"
        git push
    
    - name: Run code quality checks
      run: |
        python scripts/code_quality.py --report code_quality_${{ matrix.python-version }}.json
    
    - name: Upload code quality report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-report-${{ matrix.python-version }}
        path: code_quality_${{ matrix.python-version }}.json
        retention-days: 30

  # 单元测试
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10']
        pytorch-version: ['1.13.0', '2.0.0']
        exclude:
          # 排除一些组合以减少测试时间
          - os: macos-latest
            pytorch-version: '1.13.0'
          - os: windows-latest
            python-version: '3.10'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/AppData/Local/pip/Cache
          ~/Library/Caches/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/requirements*.txt') }}
    
    - name: Install PyTorch
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ matrix.pytorch-version }} --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install dependencies
      run: |
        pip install -e .
        pip install pytest pytest-cov pytest-xdist pytest-timeout
        pip install -r requirements-dev.txt
    
    - name: Run unit tests
      run: |
        python scripts/run_tests.py --type unit --coverage --parallel
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-reports
        path: |
          quality-report.json
          format-report.txt
          quality-gate-report.md
          auto-fix-report.md
        retention-days: 30
    
    - name: Comment quality gate results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'quality-gate-report.md';
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 质量门禁检查结果\n\n${report}`
            });
          }

  # 集成测试
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        test-suite: ['training', 'inference', 'data-processing']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ env.PYTORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install -r requirements-dev.txt
    
    - name: Run integration tests
      run: |
        python scripts/run_tests.py --type integration --suite ${{ matrix.test-suite }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results-${{ matrix.test-suite }}
        path: test-results/
        retention-days: 7

  # GPU测试 (仅在有GPU runner时运行)
  gpu-tests:
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'schedule' || github.event.inputs.run_performance_tests == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install CUDA dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ env.PYTORCH_VERSION }} --index-url https://download.pytorch.org/whl/cu118
        pip install -e .
    
    - name: Run GPU tests
      run: |
        python scripts/run_tests.py --type gpu --device cuda
    
    - name: Run performance benchmarks
      run: |
        python scripts/benchmark.py --device cuda --output-dir benchmark-results-gpu
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: gpu-benchmark-results
        path: benchmark-results-gpu/
        retention-days: 30

  # 性能基准测试
  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.run_performance_tests == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ env.PYTORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install matplotlib seaborn psutil
    
    - name: Run performance benchmarks
      run: |
        python scripts/benchmark.py --device cpu --quick --output-dir benchmark-results
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: performance-benchmark-results
        path: benchmark-results/
        retention-days: 30
    
    - name: Comment benchmark results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'benchmark-results/benchmark_summary.txt';
          if (fs.existsSync(path)) {
            const summary = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Performance Benchmark Results\n\n\`\`\`\n${summary}\n\`\`\``
            });
          }

  # 安全扫描
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.run_security_scan == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
    
    - name: Run Bandit security scan
      run: |
        bandit -r modify_multi_attention/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Run Safety dependency scan
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Run Semgrep scan
      run: |
        semgrep --config=auto --json --output=semgrep-report.json modify_multi_attention/
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-scan-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json
        retention-days: 30

  # 文档构建和部署
  docs-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
    
    - name: Build documentation
      run: |
        cd docs
        make html
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/_build/html/
        retention-days: 30
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html

  # 包构建和发布
  package-build:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/
        retention-days: 30
    
    - name: Publish to TestPyPI
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/*
    
    - name: Publish to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  # 通知和报告
  notify:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate test summary
      run: |
        echo "## CI/CD Pipeline Summary" > summary.md
        echo "" >> summary.md
        echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> summary.md
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> summary.md
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> summary.md
        echo "" >> summary.md
        echo "**Commit**: ${{ github.sha }}" >> summary.md
        echo "**Branch**: ${{ github.ref_name }}" >> summary.md
        echo "**Triggered by**: ${{ github.event_name }}" >> summary.md
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
    
    - name: Send Slack notification
      if: failure() && github.ref == 'refs/heads/main'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow

  # 清理工作
  cleanup:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, docs-build, package-build]
    if: always()
    
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          // 保留最近30天的artifacts，删除更老的
          const thirtyDaysAgo = new Date();
          thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
          
          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < thirtyDaysAgo) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name}`);
            }
          }