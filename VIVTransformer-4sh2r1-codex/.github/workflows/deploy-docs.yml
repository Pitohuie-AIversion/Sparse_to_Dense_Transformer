name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main, master, V1 ]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ main, master, V1 ]
    paths:
      - 'docs/**'
      - 'wiki/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
          working-directory: docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Create Gemfile if not exists
        run: |
          cd docs
          if [ ! -f Gemfile ]; then
            cat > Gemfile << EOF
          source "https://rubygems.org"
          
          gem "jekyll", "~> 4.3.0"
          gem "jekyll-theme-cayman"
          gem "jekyll-feed"
          gem "jekyll-sitemap"
          gem "jekyll-seo-tag"
          gem "webrick", "~> 1.7"
          
          group :jekyll_plugins do
            gem "jekyll-feed"
            gem "jekyll-sitemap"
            gem "jekyll-seo-tag"
          end
          
          platforms :mingw, :x64_mingw, :mswin, :jruby do
            gem "tzinfo", ":~> 1.2"
            gem "tzinfo-data"
          end
          
          gem "wdm", "~> 0.1.1", :platforms => [:mingw, :x64_mingw, :mswin]
          gem "http_parser.rb", "~> 0.6.0", :platforms => [:jruby]
          EOF
          fi

      - name: Install dependencies
        run: |
          cd docs
          bundle install

      - name: Convert Wiki to Pages (if needed)
        run: |
          cd docs
          if [ -f convert_wiki.py ] && [ -d ../wiki ]; then
            python3 convert_wiki.py
          fi

      - name: Build with Jekyll
        run: |
          cd docs
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/V1'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Link checker job (optional)
  link-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check links in documentation
        run: |
          find docs/pages -name "*.md" -exec markdown-link-check {} \;
        continue-on-error: true