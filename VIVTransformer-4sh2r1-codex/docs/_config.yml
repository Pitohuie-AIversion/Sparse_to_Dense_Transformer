# VIVTransformer Documentation Site Configuration
title: VIVTransformer Documentation
description: Advanced Transformer Architecture with Vision Integration
baseurl: "/Sparse_to_Dense_Transformer"
url: "https://Pitohuie-AIversion.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: jekyll-theme-cayman

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - pages/quick-start.md
  - pages/architecture.md
  - pages/training.md
  - pages/deployment.md
  - pages/api.md

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "_docs"
      type: "docs"
    values:
      layout: "doc"

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# SEO settings
author:
  name: Pitohuie
  email: 1748492875@qq.com

social:
  name: Pitohuie
  links:
    - https://github.com/Pitohuie-AIversion/Sparse_to_Dense_Transformer

# Google Analytics (可选)
# google_analytics: UA-XXXXXXXX-X

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .gitignore

# Include
include:
  - _pages

# Sass
sass:
  sass_dir: _sass
  style: compressed
