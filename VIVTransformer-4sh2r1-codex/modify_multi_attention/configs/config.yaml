# Global settings
global:
  seed: 42
  deterministic: true
  device: cuda:0
  max_memory_fraction: 0.8
  use_dataparallel: true

# Data settings
data:
  path: X:/2025/Graduation_project/simulation_results/merged_all_pressures_separated_normalized.pt
  batch_size: 128
  use_augmentation: false  # 流体数据具有物理意义，禁用数据增强
  crop_size: [128, 128]
  use_pdebench: true

# PDEBench settings - 自适应裁剪配置
pdebench:
  data_root: X:/2025/Graduation_project/report/VIVTransformer-4sh2r1-codex/modify_multi_attention/PDEBench/pdebench/data_download/data/2D/DarcyFlow
  current_pde: darcy_flow
  pde_configs:
    darcy_flow:
      data_file: 2D_DarcyFlow_beta0.1_Train.hdf5
      spatial_resolution: [128, 128]  # 原始数据分辨率
      input_size: 64  # 自适应裁剪后的输入尺寸 64x64
      sequence_length: 48  # 时间序列长度
      input_dim: 8192  # 64*64*2 = 8192 (tensor + nu)
      output_dim: 32768  # 128*128*2 = 32768 (tensor + nu)
      crop_multiplier: 0.5  # 裁剪倍数，64/128 = 0.5
      use_adaptive_crop: true  # 启用自适应裁剪
      description: "Darcy flow with adaptive crop: 64x64 input -> 128x128 output"

# Model settings
model:
  attention_type: relative
  d_model: 256
  num_heads: 4
  num_layers: 6
  input_dim: 8192  # 64*64*2 = 8192 (自适应裁剪后)
  output_dim: 32768  # 128*128*2 = 32768 (原始尺寸)
  seq_len: 48  # 时间序列长度
  max_time_steps: 100

# Training settings
training:
  epochs: 10
  learning_rate: 0.0001
  early_stop_patience: 10

# Visualization settings
visualization:
  enabled: true
  interval: 100
  max_samples: 5

# Hardware monitoring settings
hardware_monitoring:
  enable_gpu_monitoring: true
  log_batch_metrics: true
  batch_log_interval: 50
  save_detailed_metrics: true
  monitor_temperature: true
  monitor_power_usage: true

# Attention mechanisms to test
attention_test:
  types: 
    - self
    - simplified_self
    - muse
    - ufo
    - relative
    - sparse
    - lsh
    - emsa
    - mobilevit
    - mobilevitv2
    - dat
    - crossformer
    - moa
    - crisscross
    - axial
    - gfnet
    - se
    - sk
    - cbam
    - bam
    - eca
    - shuffle
    - residual
    - s2
    - triplet
    - coord
    - psa
    - danet
    - cot
    - polarized
    - outlook
    - vip
    - coatnet
    - halo
    - a2
    - parnet
    - external
    - aft
