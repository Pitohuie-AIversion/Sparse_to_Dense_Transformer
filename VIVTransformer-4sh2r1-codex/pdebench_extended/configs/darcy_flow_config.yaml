# 2D Darcy Flow 专用配置
attention_test:
  types:
  - self
  - eca
  - se
  - cbam
  - coord

current_pde: darcy_flow

data:
  path: "../../data/pdebench/2D/DarcyFlow/2D_DarcyFlow_beta0.01_Train.hdf5"
  batch_size: 32  # 较大的batch size因为数据较小
  normalize: true
  num_workers: 4
  pin_memory: true
  use_augmentation: false  # Darcy Flow通常不需要数据增强
  use_pdebench: true

global:
  device: cuda
  result_dir: ./results/darcy_flow
  seed: 42

model:
  attention_type: self
  d_model: 256
  input_dim: 16384  # 128x128 = 16384
  num_heads: 8
  num_layers: 4
  output_dim: 16384
  dropout: 0.05  # 较小的dropout

pdebench:
  data_root: ../../data/pdebench
  pde_configs:
    darcy_flow:
      data_file: 2D/DarcyFlow/2D_DarcyFlow_beta0.01_Train.hdf5
      description: "2D Darcy Flow - Elliptic PDE for porous media flow"
      input_dim: 16384
      output_dim: 16384
      sequence_length: 1  # 稳态问题，单时间步
      spatial_resolution:
      - 128
      - 128
      channels: 1
      physics_type: "elliptic_pde"
      beta_parameter: 0.01
      permeability_range: [0.1, 10.0]
      
training:
  epochs: 30
  learning_rate: 0.001  # 较大的学习率，因为问题相对简单
  scheduler: step
  step_size: 10
  gamma: 0.5
  weight_decay: 1.0e-05
  early_stop_patience: 10
  
experiment:
  name: "darcy_flow_study"
  description: "2D Darcy Flow方程的深度学习求解 - 多孔介质流动"
  save_checkpoints: true
  log_interval: 10
  eval_interval: 50
  
visualization:
  enabled: true
  save_plots: true
  plot_interval: 100
  fields_to_plot:
  - "pressure"
  - "permeability"
  - "velocity_magnitude"
  - "streamlines"