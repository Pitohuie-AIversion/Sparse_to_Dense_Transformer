# Compressible Navier-Stokes 专用配置
attention_test:
  types:
  - MultiHeadAttention
  - ECAAttention
  - SEAttention
  - CBAM
  - CoordinateAttention

current_pde: ns_compressible

data:
  path: "../../data/pdebench/2D/NS_incom/ns_incom_inhom_2d_512-0.h5"
  batch_size: 8  # 较小的batch size因为数据更大
  normalize: true
  num_workers: 4
  pin_memory: true
  use_augmentation: true  # 启用数据增强
  use_pdebench: true

global:
  device: cuda
  result_dir: ./results/ns_compressible
  seed: 42

model:
  attention_type: MultiHeadAttention
  d_model: 512  # 更大的模型维度
  input_dim: 4096  # 64x64 = 4096
  num_heads: 16  # 更多注意力头
  num_layers: 6   # 更深的网络
  output_dim: 4096
  dropout: 0.1

pdebench:
  data_root: ../../data/pdebench
  pde_configs:
    ns_compressible:
      data_file: 2D/NS_incom/ns_incom_inhom_2d_512-0.h5
      description: "2D Compressible Navier-Stokes Equations - High Resolution"
      input_dim: 4096
      output_dim: 4096
      sequence_length: 49
      spatial_resolution:
      - 64
      - 64
      channels: 1
      physics_type: "hyperbolic_pde"
      reynolds_number: 1000
      mach_number: 0.3
      
training:
  epochs: 50
  learning_rate: 0.00005  # 较小的学习率
  scheduler: cosine
  weight_decay: 1.0e-04
  early_stop_patience: 20
  gradient_clip_norm: 1.0  # 梯度裁剪
  
experiment:
  name: "ns_compressible_study"
  description: "Compressible Navier-Stokes方程的深度学习求解"
  save_checkpoints: true
  log_interval: 5
  eval_interval: 25
  
visualization:
  enabled: true
  save_plots: true
  plot_interval: 50
  fields_to_plot:
  - "velocity_u"
  - "velocity_v"
  - "pressure"
  - "density"
  - "vorticity"