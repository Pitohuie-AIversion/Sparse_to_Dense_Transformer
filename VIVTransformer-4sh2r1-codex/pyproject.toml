[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivtransformer"
version = "1.0.0"
description = "A comprehensive framework for testing and comparing 38 different attention mechanisms in transformer architectures"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "VIVTransformer Contributors", email = "your.email@example.com"},
]
maintainers = [
    {name = "VIVTransformer Contributors", email = "your.email@example.com"},
]
keywords = [
    "transformer",
    "attention",
    "deep learning",
    "machine learning",
    "pytorch",
    "neural networks",
    "artificial intelligence",
    "research",
    "benchmark",
    "comparison",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.21.0",
    "pyyaml>=5.4.0",
    "matplotlib>=3.3.0",
    "fightingcv_attention>=0.0.9",
    "tqdm>=4.62.0",
    "tensorboard>=2.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
]
dynamic = []

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.8.0",
    "black>=21.0.0",
    "isort>=5.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
    "bandit>=1.7.0",
    "safety>=1.10.0",
    "pylint>=2.15.0",
    "autopep8>=1.7.0",
    "docformatter>=1.5.0",
    "unimport>=0.12.0",
    "radon>=5.1.0",
    "vulture>=2.6",
    "pydocstyle>=6.1.0",
    "xenon>=0.9.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.15.0",
    "sphinx-copybutton>=0.4.0",
    "sphinx-design>=0.1.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
    "plotly>=5.0.0",
    "ipykernel>=6.0.0",
]
wandb = [
    "wandb>=0.12.0",
]
mlflow = [
    "mlflow>=1.20.0",
]
optuna = [
    "optuna>=2.10.0",
]
visualization = [
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "altair>=4.2.0",
]
all = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "isort>=5.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
    "bandit>=1.7.0",
    "safety>=1.10.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.15.0",
    "sphinx-copybutton>=0.4.0",
    "sphinx-design>=0.1.0",
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
    "plotly>=5.0.0",
    "ipykernel>=6.0.0",
    "wandb>=0.12.0",
    "mlflow>=1.20.0",
    "optuna>=2.10.0",
    "bokeh>=2.4.0",
    "altair>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/VIVTransformer"
Documentation = "https://github.com/yourusername/VIVTransformer/wiki"
Repository = "https://github.com/yourusername/VIVTransformer"
"Bug Tracker" = "https://github.com/yourusername/VIVTransformer/issues"
Changelog = "https://github.com/yourusername/VIVTransformer/blob/main/CHANGELOG.md"
Contributing = "https://github.com/yourusername/VIVTransformer/blob/main/CONTRIBUTING.md"

[project.scripts]
vivtransformer = "main:main"
viv-train = "main:main"
viv-test = "scripts.test:main"
viv-benchmark = "scripts.benchmark:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # 在当前目录查找包
exclude = ["tests*"]  # 排除测试包

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

# Black 配置
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded by a single or double slash
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | results
    | logs
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

# isort 配置
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/__init__.py"]
known_first_party = ["vivtransformer", "modify_multi_attention"]
known_third_party = [
    "torch",
    "numpy",
    "matplotlib",
    "yaml",
    "tqdm",
    "sklearn",
    "pandas",
    "seaborn",
    "fightingcv_attention",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# MyPy 配置
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fightingcv_attention.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "pandas.*",
    "yaml.*",
    "tqdm.*",
]
ignore_missing_imports = true

# Pytest 配置
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m "not slow"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage 配置
[tool.coverage.run]
source = ["."]  # 覆盖当前目录
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.tox/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
    "*/results/*",
    "*/logs/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]
ignore_errors = true
show_missing = true
skip_covered = false
skip_empty = false
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Bandit 配置 (安全检查)
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

# Flake8 配置 (在 setup.cfg 中定义，因为 flake8 不支持 pyproject.toml)
# 这里提供参考配置
# [flake8]
# max-line-length = 88
# extend-ignore = E203, W503, E501
# exclude = .git,__pycache__,build,dist,.tox,.venv,venv
# per-file-ignores = __init__.py:F401
# max-complexity = 10

# Pylint 配置
[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0613",  # Unused argument
    "W0622",  # Redefined builtin
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 6
max-branches = 15
max-statements = 50
max-parents = 7
max-attributes = 10
min-public-methods = 1
max-public-methods = 20
max-bool-expr = 5

# Vulture 配置 (死代码检测)
[tool.vulture]
min_confidence = 80
paths = ["modify_multi_attention", "scripts"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@require_*"]
ignore_names = ["_*", "test_*"]

# Radon 配置 (复杂度分析)
[tool.radon]
cc_min = "B"
mi_min = "B"
raw_min = "B"
hal_min = "B"

# Docformatter 配置
[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
make-summary-multi-line = false
close-quotes-on-newline = false
force-wrap = false
tab-width = 4
pre-summary-newline = false
pre-summary-space = false

# Pydocstyle 配置
[tool.pydocstyle]
inherit = false
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213"]
match = "(?!test_).*\.py"
match-dir = "(?!tests)[^\.].*"

