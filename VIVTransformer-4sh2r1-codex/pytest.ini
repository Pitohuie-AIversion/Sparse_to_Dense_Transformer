[tool:pytest]
# pytest配置文件

# 最小版本要求
minversion = 6.0

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --durations=10
    --color=yes

# 测试标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU
    performance: marks tests for performance benchmarking
    smoke: marks tests as smoke tests (quick validation)
    regression: marks tests for regression testing
    experimental: marks tests for experimental features

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    # PyTorch相关警告
    ignore::torch.jit.TracerWarning
    # NumPy相关警告
    ignore::numpy.VisibleDeprecationWarning

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置（如果使用pytest-cov）
# addopts = --cov=modify_multi_attention --cov-report=html --cov-report=term-missing

# 并行测试配置（如果使用pytest-xdist）
# addopts = -n auto

# 超时配置（如果使用pytest-timeout）
timeout = 300
timeout_method = thread

# 临时目录配置
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# 缓存配置
cache_dir = .pytest_cache

# 收集配置
collect_ignore = [
    "setup.py",
    "docs",
    "build",
    "dist",
    ".git",
    ".github",
    "__pycache__",
    "*.egg-info"
]

# 最小失败配置
# --maxfail=1  # 第一个失败后停止
# --exitfirst  # 等同于 --maxfail=1

# 详细输出配置
# -v  # 详细模式
# -vv # 更详细模式
# -s  # 不捕获输出

# 特定测试运行示例：
# pytest tests/unit/                    # 只运行单元测试
# pytest tests/integration/             # 只运行集成测试
# pytest -m "not slow"                 # 跳过慢速测试
# pytest -m "unit and not gpu"         # 运行非GPU的单元测试
# pytest -k "test_attention"           # 运行包含attention的测试
# pytest --lf                          # 只运行上次失败的测试
# pytest --ff                          # 先运行上次失败的测试