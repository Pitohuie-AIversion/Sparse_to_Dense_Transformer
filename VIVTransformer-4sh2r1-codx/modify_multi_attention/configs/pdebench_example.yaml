attention_test:
  types:
  - MultiHeadAttention
  - ECAAttention
  - SEAttention
current_pde: ns_incom
data:
  batch_size: 16
  normalize: true
  num_workers: 4
  pin_memory: true
  use_augmentation: false
  use_pdebench: true
global:
  device: cuda
  result_dir: ./results/pdebench_example
  seed: 42
model:
  attention_type: MultiHeadAttention
  d_model: 256
  input_dim: 4096
  num_heads: 8
  num_layers: 4
  output_dim: 4096
pdebench:
  data_root: ./data/pdebench
  pde_configs:
    darcy_flow:
      data_file: darcy_flow_2d.h5
      description: Darcy flow equation
      input_dim: 1024
      output_dim: 1024
      sequence_length: 1
      spatial_resolution:
      - 32
      - 32
    ns_incom:
      data_file: ns_incom_inhom_2d.h5
      description: Navier-Stokes incompressible flow
      input_dim: 4096
      output_dim: 4096
      sequence_length: 49
      spatial_resolution:
      - 64
      - 64
    shallow_water:
      data_file: shallow_water_2d.h5
      description: Shallow water equations
      input_dim: 16384
      output_dim: 16384
      sequence_length: 40
      spatial_resolution:
      - 128
      - 128
training:
  epochs: 10
  learning_rate: 0.0001
  scheduler: cosine
  weight_decay: 1.0e-05
