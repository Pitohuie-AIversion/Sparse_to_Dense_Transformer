<!-- 链接验证器组件 / Link Validator Component -->
<div class="link-validator" id="link-validator" style="display: none;">
  <div class="validator-header">
    <h3>🔍 链接验证器 / Link Validator</h3>
    <button class="validator-close" aria-label="Close validator">&times;</button>
  </div>
  <div class="validator-content">
    <div class="validator-stats">
      <span class="stat-item">总链接: <span id="total-links">0</span></span>
      <span class="stat-item">有效: <span id="valid-links">0</span></span>
      <span class="stat-item">无效: <span id="invalid-links">0</span></span>
      <span class="stat-item">状态: <span id="validator-status">就绪</span></span>
    </div>
    <div class="validator-progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">0%</span>
    </div>
    <div class="validator-results" id="validator-results"></div>
    <div class="validator-actions">
      <button class="validator-btn primary" id="start-validation">开始验证 / Start Validation</button>
      <button class="validator-btn secondary" id="export-results">导出结果 / Export Results</button>
    </div>
  </div>
</div>

<!-- 链接验证器触发器 / Link Validator Trigger -->
<button class="validator-trigger" id="validator-trigger" title="验证页面链接 / Validate page links">
  🔍
</button>

<script>
// 链接验证器功能 / Link Validator Functionality
class LinkValidator {
  constructor() {
    this.links = [];
    this.results = [];
    this.isValidating = false;
    this.init();
  }
  
  init() {
    this.createValidator();
    this.bindEvents();
  }
  
  createValidator() {
    const trigger = document.getElementById('validator-trigger');
    const validator = document.getElementById('link-validator');
    const closeBtn = document.querySelector('.validator-close');
    
    if (!trigger || !validator || !closeBtn) return;
    
    // 显示验证器
    trigger.addEventListener('click', () => {
      validator.style.display = 'flex';
      this.collectLinks();
    });
    
    // 关闭验证器
    closeBtn.addEventListener('click', () => {
      validator.style.display = 'none';
    });
    
    // ESC键关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && validator.style.display === 'flex') {
        validator.style.display = 'none';
      }
    });
    
    // 点击外部关闭
    validator.addEventListener('click', (e) => {
      if (e.target === validator) {
        validator.style.display = 'none';
      }
    });
  }
  
  collectLinks() {
    const allLinks = document.querySelectorAll('a[href]');
    this.links = Array.from(allLinks).map(link => ({
      element: link,
      href: link.href,
      text: link.textContent.trim() || link.href,
      isExternal: !link.href.startsWith(window.location.origin)
    }));
    
    this.updateStats();
  }
  
  updateStats() {
    document.getElementById('total-links').textContent = this.links.length;
    document.getElementById('valid-links').textContent = this.results.filter(r => r.status === 'valid').length;
    document.getElementById('invalid-links').textContent = this.results.filter(r => r.status === 'invalid').length;
  }
  
  async validateLinks() {
    if (this.isValidating) return;
    
    this.isValidating = true;
    this.results = [];
    const resultsContainer = document.getElementById('validator-results');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const statusText = document.getElementById('validator-status');
    const startBtn = document.getElementById('start-validation');
    
    startBtn.disabled = true;
    resultsContainer.innerHTML = '';
    statusText.textContent = '验证中...';
    
    for (let i = 0; i < this.links.length; i++) {
      const link = this.links[i];
      const result = await this.validateLink(link);
      this.results.push(result);
      
      // 更新进度
      const progress = ((i + 1) / this.links.length) * 100;
      progressFill.style.width = `${progress}%`;
      progressText.textContent = `${Math.round(progress)}%`;
      
      // 显示结果
      this.displayResult(result);
      this.updateStats();
      
      // 小延迟以避免阻塞UI
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    
    this.isValidating = false;
    startBtn.disabled = false;
    statusText.textContent = '完成';
  }
  
  async validateLink(link) {
    try {
      // 跳过锚点链接
      if (link.href.startsWith('#')) {
        const target = document.querySelector(link.href);
        return {
          ...link,
          status: target ? 'valid' : 'invalid',
          message: target ? '锚点存在' : '锚点不存在'
        };
      }
      
      // 跳过JavaScript链接
      if (link.href.startsWith('javascript:')) {
        return {
          ...link,
          status: 'warning',
          message: 'JavaScript链接'
        };
      }
      
      // 跳过mailto链接
      if (link.href.startsWith('mailto:')) {
        return {
          ...link,
          status: 'valid',
          message: '邮件链接'
        };
      }
      
      // 对于外部链接，使用HEAD请求检查
      if (link.isExternal) {
        try {
          const response = await fetch(link.href, {
            method: 'HEAD',
            mode: 'no-cors'
          });
          return {
            ...link,
            status: 'valid',
            message: '外部链接'
          };
        } catch (error) {
          return {
            ...link,
            status: 'warning',
            message: '无法验证外部链接'
          };
        }
      }
      
      // 对于内部链接，检查是否存在
      const url = new URL(link.href);
      const path = url.pathname;
      
      // 这里简化处理，实际应该检查文件是否存在
      return {
        ...link,
        status: 'valid',
        message: '内部链接'
      };
      
    } catch (error) {
      return {
        ...link,
        status: 'invalid',
        message: `验证错误: ${error.message}`
      };
    }
  }
  
  displayResult(result) {
    const resultsContainer = document.getElementById('validator-results');
    const resultDiv = document.createElement('div');
    resultDiv.className = 'validator-result';
    
    const statusClass = result.status;
    const statusIcon = result.status === 'valid' ? '✅' : result.status === 'invalid' ? '❌' : '⚠️';
    
    resultDiv.innerHTML = `
      <div class="result-status ${statusClass}"></div>
      <a href="${result.href}" class="result-link" target="_blank" rel="noopener">
        ${result.text.substring(0, 60)}${result.text.length > 60 ? '...' : ''}
      </a>
      <span class="result-message">${result.message}</span>
    `;
    
    resultsContainer.appendChild(resultDiv);
  }
  
  exportResults() {
    const validLinks = this.results.filter(r => r.status === 'valid');
    const invalidLinks = this.results.filter(r => r.status === 'invalid');
    const warningLinks = this.results.filter(r => r.status === 'warning');
    
    const report = {
      timestamp: new Date().toISOString(),
      summary: {
        total: this.results.length,
        valid: validLinks.length,
        invalid: invalidLinks.length,
        warnings: warningLinks.length
      },
      details: {
        valid: validLinks,
        invalid: invalidLinks,
        warnings: warningLinks
      }
    };
    
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `link-validation-report-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  
  bindEvents() {
    const startBtn = document.getElementById('start-validation');
    const exportBtn = document.getElementById('export-results');
    
    if (startBtn) {
      startBtn.addEventListener('click', () => this.validateLinks());
    }
    
    if (exportBtn) {
      exportBtn.addEventListener('click', () => this.exportResults());
    }
  }
}

// 初始化链接验证器
new LinkValidator();
</script>
