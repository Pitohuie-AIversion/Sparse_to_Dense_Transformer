<style>
/* 响应式导航样式 / Responsive Navigation Styles */
.responsive-nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  padding: 0.5rem 0;
}

.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-toggle {
  display: none;
  background: none;
  border: none;
  padding: 0.5rem;
  cursor: pointer;
  border-radius: 4px;
  transition: background-color 0.2s ease;
}

.nav-toggle:hover {
  background: rgba(0, 0, 0, 0.05);
}

.nav-toggle-icon {
  display: block;
  width: 24px;
  height: 2px;
  background: currentColor;
  position: relative;
  transition: all 0.3s ease;
}

.nav-toggle-icon::before,
.nav-toggle-icon::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: currentColor;
  transition: all 0.3s ease;
}

.nav-toggle-icon::before {
  top: -8px;
}

.nav-toggle-icon::after {
  top: 8px;
}

.nav-toggle[aria-expanded="true"] .nav-toggle-icon {
  background: transparent;
}

.nav-toggle[aria-expanded="true"] .nav-toggle-icon::before {
  top: 0;
  transform: rotate(45deg);
}

.nav-toggle[aria-expanded="true"] .nav-toggle-icon::after {
  top: 0;
  transform: rotate(-45deg);
}

.nav-menu {
  display: flex;
  align-items: center;
}

.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-item {
  position: relative;
}

.nav-link {
  text-decoration: none;
  color: #374151;
  font-weight: 500;
  padding: 0.5rem 0;
  transition: color 0.2s ease;
  position: relative;
}

.nav-link:hover {
  color: #2563eb;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: #2563eb;
  transition: width 0.2s ease;
}

.nav-link:hover::after {
  width: 100%;
}

.nav-link.external::after {
  content: ' ↗';
  position: static;
  width: auto;
  height: auto;
  background: none;
}

/* 下拉菜单 / Dropdown Menu */
.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: white;
  border: 1px solid rgba(0, 0, 0, 0.1);
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  min-width: 200px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.2s ease;
  z-index: 1001;
}

.nav-item:hover .dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown-menu li {
  margin: 0;
}

.dropdown-menu a {
  display: block;
  padding: 0.75rem 1rem;
  text-decoration: none;
  color: #374151;
  transition: all 0.2s ease;
  border-radius: 4px;
}

.dropdown-menu a:hover {
  background: rgba(37, 99, 235, 0.1);
  color: #2563eb;
}

/* 深色模式支持 / Dark Mode Support */
html[data-theme='dark'] .responsive-nav {
  background: rgba(30, 41, 59, 0.95);
  border-bottom-color: rgba(255, 255, 255, 0.1);
}

html[data-theme='dark'] .nav-link {
  color: #e5e7eb;
}

html[data-theme='dark'] .nav-link:hover {
  color: #60a5fa;
}

html[data-theme='dark'] .nav-link::after {
  background: #60a5fa;
}

html[data-theme='dark'] .dropdown-menu {
  background: #1e293b;
  border-color: rgba(255, 255, 255, 0.1);
}

html[data-theme='dark'] .dropdown-menu a {
  color: #e5e7eb;
}

html[data-theme='dark'] .dropdown-menu a:hover {
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
}

html[data-theme='dark'] .nav-toggle:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* 响应式设计 / Responsive Design */
@media (max-width: 768px) {
  .nav-toggle {
    display: block;
  }
  
  .nav-menu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    transform: translateY(-100%);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }
  
  .nav-menu.active {
    transform: translateY(0);
    opacity: 1;
    visibility: visible;
  }
  
  .nav-list {
    flex-direction: column;
    padding: 1rem;
    gap: 0;
  }
  
  .nav-item {
    width: 100%;
  }
  
  .nav-link {
    display: block;
    padding: 0.75rem 0;
  }
  
  .dropdown-menu {
    position: static;
    opacity: 1;
    visibility: visible;
    transform: none;
    box-shadow: none;
    border: none;
    background: rgba(0, 0, 0, 0.05);
    margin-top: 0.5rem;
    margin-left: 1rem;
  }
  
  html[data-theme='dark'] .nav-menu {
    background: rgba(30, 41, 59, 0.98);
  }
  
  html[data-theme='dark'] .dropdown-menu {
    background: rgba(0, 0, 0, 0.2);
  }
}

@media (max-width: 480px) {
  .nav-container {
    padding: 0 0.5rem;
  }
  
  .nav-list {
    padding: 0.5rem;
  }
}

/* 高对比度模式支持 / High Contrast Mode Support */
@media (prefers-contrast: high) {
  .nav-link {
    color: #000;
  }
  
  .nav-link:hover {
    color: #0066cc;
  }
  
  html[data-theme='dark'] .nav-link {
    color: #fff;
  }
  
  html[data-theme='dark'] .nav-link:hover {
    color: #66b3ff;
  }
}

/* 减少动画偏好 / Reduced Motion Preference */
@media (prefers-reduced-motion: reduce) {
  .nav-toggle-icon,
  .nav-toggle-icon::before,
  .nav-toggle-icon::after,
  .nav-link,
  .nav-link::after,
  .dropdown-menu {
    transition: none;
  }
}
</style>

<script>
// 响应式导航交互 / Responsive Navigation Interaction
document.addEventListener('DOMContentLoaded', function() {
  const navToggle = document.querySelector('.nav-toggle');
  const navMenu = document.querySelector('.nav-menu');
  const navLinks = document.querySelectorAll('.nav-link');
  
  // 切换导航菜单
  function toggleNav() {
    const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
    navToggle.setAttribute('aria-expanded', !isExpanded);
    navMenu.classList.toggle('active');
    
    // 添加动画效果
    if (!isExpanded) {
      navToggle.style.transform = 'rotate(90deg)';
    } else {
      navToggle.style.transform = 'rotate(0deg)';
    }
  }
  
  navToggle.addEventListener('click', toggleNav);
  
  // 点击导航链接后关闭菜单（移动端）
  navLinks.forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        toggleNav();
      }
    });
  });
  
  // 点击外部关闭菜单
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.responsive-nav') && navMenu.classList.contains('active')) {
      toggleNav();
    }
  });
  
  // 键盘导航支持
  navToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleNav();
    }
  });
  
  // ESC键关闭菜单
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && navMenu.classList.contains('active')) {
      toggleNav();
    }
  });
  
  // 窗口大小改变时重置菜单状态
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
      navToggle.setAttribute('aria-expanded', 'false');
      navMenu.classList.remove('active');
      navToggle.style.transform = 'rotate(0deg)';
    }
  });
  
  // 添加滚动效果
  let lastScrollTop = 0;
  const responsiveNav = document.querySelector('.responsive-nav');
  
  window.addEventListener('scroll', () => {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
    if (scrollTop > lastScrollTop && scrollTop > 100) {
      // 向下滚动 - 隐藏导航
      responsiveNav.style.transform = 'translateY(-100%)';
    } else {
      // 向上滚动 - 显示导航
      responsiveNav.style.transform = 'translateY(0)';
    }
    
    lastScrollTop = scrollTop;
  });
  
  // 平滑滚动到锚点
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }
    });
  });
});
</script>
