<!DOCTYPE html>
<html lang="{{ site.active_lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="site-baseurl" content="{{ site.baseurl }}">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}">
  <script type="text/javascript" src="{{ '/assets/js/vendor/lunr.min.js' | relative_url }}"></script>
  <script type="text/javascript" src="{{ '/assets/js/just-the-docs.js' | relative_url }}"></script>
  <script type="text/javascript" src="{{ '/assets/js/language-switcher.js' | relative_url }}"></script>
</head>
<body>
  <!-- Language Switcher -->
  {% include language-switcher.html %}

<div class="doc-content">
  {% if page.title %}
  <h1>{{ page.title }}</h1>
  {% endif %}
  
  {% if page.description %}
  <p class="description">{{ page.description }}</p>
  {% endif %}
  
  {{ content }}
  
  {% if page.date %}
  <p class="date">Last updated: {{ page.date | date: "%B %d, %Y" }}</p>
  {% endif %}
</div>

</body>
</html>
