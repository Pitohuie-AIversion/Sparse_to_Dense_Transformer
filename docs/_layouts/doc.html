---
layout: default
---

<div class="doc-content">
  {% if page.title %}
  <h1>{{ page.title }}</h1>
  {% endif %}
  
  {% if page.description %}
  <p class="description">{{ page.description }}</p>
  {% endif %}
  
  {{ content }}
  
  {% if page.date %}
  <p class="date">Last updated: {{ page.date | date: "%B %d, %Y" }}</p>
  {% endif %}
</div>
